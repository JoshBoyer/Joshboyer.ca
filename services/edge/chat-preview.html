<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0755ff">
  <title>Private chat preview — Josh Boyer</title>
  <link rel="stylesheet" href="/chat-assistant.css">
  <script src="/chat-assistant.js" defer></script>
</head>
<body class="chat-preview-page">
  <header class="chat-preview-header">
    <a class="chat-preview-brand" href="https://joshboyer.ca/">Josh Boyer<span>.</span></a>
    <span class="chat-private-label">Private preview</span>
  </header>
  <main class="chat-preview-layout">
    <div class="chat-preview-main">
      <form class="chat-access" data-chat-access hidden>
        <h2>Private preview access</h2>
        <p>Use the preview token supplied by Josh. It is used only to sign in.</p>
        <label for="chat-preview-token">Preview token</label>
        <input id="chat-preview-token" type="password" name="token" autocomplete="off" spellcheck="false" autocapitalize="off" required maxlength="256">
        <button class="chat-send" type="submit">Open private chat</button>
        <p role="status" aria-live="polite"></p>
      </form>
      <div data-chat-preview></div>
    </div>
  </main>
</body>
</html>
